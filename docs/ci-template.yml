# To enable GitHub Actions, copy this file to .github/workflows/ci.yml
# using an account/token with workflow-write permission.
name: Research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit publication and recorded results
        run: |
          python scripts/check_publication.py
          python scripts/verify_results.py
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'torch>=2.8,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run deterministic harness and regression tests
        run: python -m unittest discover -s tests -v
